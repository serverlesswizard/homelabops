---
- name: Deploy Uptime Kuma
  hosts: workers
  become: true

  tasks:
    - name: Create uptime-kuma directory
      file:
        path: /home/pentium-nas/uptime-kuma
        state: directory
        owner: pentium-nas
        group: pentium-nas
        mode: '0755'

    - name: Copy compose file
      copy:
        src: ../monitoring/uptime-kuma/compose.yaml
        dest: /home/pentium-nas/uptime-kuma/compose.yaml
        owner: pentium-nas
        group: pentium-nas
        mode: '0644'

    - name: Create data directory
      file:
        path: /home/pentium-nas/uptime-kuma/data
        state: directory
        owner: pentium-nas
        group: pentium-nas
        mode: '0755'

    - name: Start Uptime Kuma
      community.docker.docker_compose_v2:
        project_src: /home/pentium-nas/uptime-kuma
        state: present
