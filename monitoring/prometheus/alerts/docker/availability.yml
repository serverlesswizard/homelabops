groups:
  - name: docker-availability
    rules:

      - alert: ContainerDown
        expr: docker_container_running == 0
        for: 1m
        labels:
          severity: critical
          category: docker

        annotations:
          summary: "Container {{ $labels.container }} is down"
          description: "Docker container '{{ $labels.container }}' has been stopped for more than 1 minute."
