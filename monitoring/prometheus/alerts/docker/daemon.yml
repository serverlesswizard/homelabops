groups:
  - name: docker-daemon
    rules:

      - alert: DockerDaemonDown
        expr: node_systemd_unit_state{name="docker.service",state="active"} == 0
        for: 2m
        labels:
          severity: critical
          category: docker
        annotations:
          summary: "Docker daemon is down"
          description: "docker.service is not active."
