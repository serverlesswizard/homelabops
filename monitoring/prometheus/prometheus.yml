global:
  scrape_interval: 15s

rule_files:
  - alerts/node/*.yml
  - alerts/docker/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ryzen-homelab
    static_configs:
      - targets:
          - 192.168.0.122:9100

  - job_name: pentium-nas
    static_configs:
      - targets:
          - 192.168.0.113:9100

  - job_name: ryzen-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: pentium-cadvisor
    static_configs:
      - targets:
          - 192.168.0.113:8088

  - job_name: docker-health-exporter
    static_configs:
      - targets:
          - docker-health-exporter:9066

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
